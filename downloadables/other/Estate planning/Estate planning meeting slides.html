<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's chat — Estate planning meeting</title>
<style>
:root{--navy:#131c34;--navy2:#1a2744;--ink:#1d2a45;--muted:#5b667d;--gold:#b08d57;--panel:#e8edf5;--line:#d5dbe7;--bg:#f6f7fb;--ok:#1f7a3d;--warn:#a02222}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:19px;line-height:1.45}
h1,h2,h3,.serif{font-family:Cambria,Georgia,"Times New Roman",serif}
#app{display:flex;flex-direction:column;height:100vh}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px;flex:0 0 auto}
.top .brand{font-family:Cambria,Georgia,serif;font-weight:700;font-size:1.15rem;letter-spacing:.2px}
.top .brand small{color:var(--gold);font-weight:400;font-style:italic;margin-left:8px}
.top .sp{flex:1}
.top .status{font-size:.8rem;color:#b9c3dc}
.btn{font:inherit;font-size:.9rem;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;min-height:44px}
.btn:hover{background:#eef2f9}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{background:#9a7b49}
.btn.ghost{background:transparent;color:#fff;border-color:#43507a}
.btn.ghost:hover{background:#243258}
.btn.sm{padding:5px 12px;min-height:34px;font-size:.82rem}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.main{display:flex;flex:1 1 auto;min-height:0}
nav{flex:0 0 268px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 0}
nav .grp{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:14px 18px 4px}
nav a{display:flex;align-items:center;gap:8px;padding:8px 18px;cursor:pointer;color:var(--ink);font-size:.92rem;border-left:4px solid transparent;text-decoration:none}
nav a:hover{background:#f1f4fa}
nav a.cur{background:var(--panel);border-left-color:var(--gold);font-weight:700}
nav a.skip{color:#9aa3b8;text-decoration:line-through}
nav a .dot{width:9px;height:9px;border-radius:50%;background:#d5dbe7;flex:0 0 auto}
nav a .dot.on{background:var(--ok)}
#stage{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
#slide{flex:1 1 auto;overflow:auto;padding:26px 44px 40px}
.foot{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px}
.foot .sp{flex:1}
.foot label{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.slide-title{font-size:2.1rem;margin:0 0 6px;color:var(--navy);font-weight:700}
.rule{height:1px;background:var(--line);margin:8px 0 20px}
.intro{font-style:italic;color:var(--muted);margin:0 0 16px}
.bullets{list-style:none;margin:0;padding:0}
.bullets li{position:relative;padding-left:22px;margin:7px 0}
.bullets li:before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--navy)}
.bullets li.sub{margin-left:20px;color:var(--muted);font-size:.93em}
.bullets li.sub:before{background:none;content:"–";width:auto;height:auto;top:0;left:0;color:var(--muted)}
.cols{align-items:start;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cols.sketch{grid-template-columns:minmax(260px,5fr) 8fr}
@media(max-width:1000px){.cols,.cols.sketch{grid-template-columns:1fr}nav{flex-basis:200px}#slide{padding:18px}}
.panel{background:var(--panel);border-radius:12px;padding:20px 24px}
.panel h3{margin:0 0 10px;color:var(--navy);font-size:1.25rem}
.panel p{margin:8px 0}
.note-box{margin-top:18px}
.lbl-s{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 6px}
table.ro{border-collapse:collapse;width:100%;font-size:.93rem;margin:10px 0}
table.ro th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600}
table.ro td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;background:#fff}
table.ro td:first-child{font-weight:700;color:var(--navy);background:#f3f5fa}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;min-width:0}
.field>label{font-size:.82rem;font-weight:700;color:var(--muted)}
.field .hint{font-size:.76rem;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=tel],select,textarea{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid #b9c2d6;border-radius:8px;background:#fff;color:var(--ink);width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.grid4{display:grid;grid-template-columns:2fr 2fr 1fr 1fr;gap:0 12px}
.span2{grid-column:span 2}
@media(max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.span2{grid-column:auto}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:14px 0}
.card .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card .ctitle{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.chk{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:.95rem}
.chk input{width:22px;height:22px;flex:0 0 auto}
.checks{display:flex;gap:24px;flex-wrap:wrap;margin:4px 0 8px}
.addrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.skip-banner{background:#fff4e0;border:1px solid #e6c98f;color:#7a5a1c;padding:8px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem}
/* sketch */
.sk{border:2px dashed #cfd6e6;border-radius:12px;background:#fff;padding:10px}
.sk .skl{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:2px 4px 8px}
.sk canvas{width:100%;display:block;background:#fff;border:1px solid #eef0f6;border-radius:8px;touch-action:none;cursor:crosshair}
.sk .tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #aab3c8;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--gold)}
.tb .tool{font:inherit;font-size:.82rem;font-weight:600;padding:5px 12px;min-height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.tb .tool.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* cover */
.cover{background:var(--navy);color:#fff;margin:-26px -44px -40px;padding:80px 70px;min-height:100%;position:relative;overflow:hidden}
.cover:before{content:"";position:absolute;right:-140px;top:-170px;width:420px;height:420px;border-radius:50%;background:#1a2744}
.cover:after{content:"";position:absolute;left:-100px;bottom:-120px;width:300px;height:300px;border-radius:50%;background:#1a2744}
.cover>*{position:relative;z-index:1}
.cover .bar{width:70px;height:8px;background:var(--gold);margin-bottom:22px}
.cover h1{font-size:4rem;margin:0 0 6px;font-weight:700}
.cover .sub{font-style:italic;color:#d9bf92;font-size:1.5rem;margin-bottom:40px}
.cover .field>label{color:#c9d2e8}
.cover .box{max-width:420px}
.cover .btn{margin-top:14px}
.divider{background:var(--navy);color:#fff;margin:-26px -44px -40px;padding:0 70px;min-height:100%;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.divider:before{content:"";position:absolute;right:-120px;top:-150px;width:380px;height:380px;border-radius:50%;background:#1a2744}
.divider>*{position:relative;z-index:1}
.divider .sec{color:var(--gold);letter-spacing:.2em;font-weight:700;font-size:.95rem}
.divider .bar{width:56px;height:7px;background:var(--gold);margin:14px 0 10px}
.divider h1{font-size:3rem;margin:0}
.sumtab{width:100%;border-collapse:collapse;font-size:.95rem;margin:8px 0 18px}
.sumtab td,.sumtab th{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.sumtab th{color:var(--muted);font-weight:700;width:38%}
.pill{display:inline-block;background:var(--panel);border-radius:999px;padding:2px 12px;font-size:.85rem;margin:2px 4px 2px 0}
.warn{color:var(--warn);font-weight:700}
.okc{color:var(--ok);font-weight:700}
table.idt{border-collapse:collapse;width:100%;margin:6px 0 14px}
table.idt th{background:var(--navy);color:#fff;font-size:.8rem;text-align:left;padding:8px 10px}
table.idt td{padding:6px;background:#fff;border-bottom:1px solid var(--line)}
table.idt input,table.idt select{min-height:40px;padding:6px 8px}
.contact{font-size:1.2rem}

#rec-overlay{display:none;position:fixed;inset:0;background:#e9ecf3;overflow:auto;z-index:50}
body.rec-open #rec-overlay{display:block}
.rec-bar{position:sticky;top:0;background:#131c34;padding:10px 18px;display:flex;gap:12px;align-items:center;z-index:2}
.rec{background:#fff;max-width:980px;margin:18px auto;padding:34px 44px;box-shadow:0 2px 14px rgba(0,0,0,.15);font-size:11.5px;line-height:1.4;color:#1d2a45}
.rec h1{font-family:Cambria,Georgia,serif;font-size:26px;margin:4px 0 2px;color:#131c34}
.rec h2{font-family:Cambria,Georgia,serif;font-size:17px;margin:22px 0 6px;color:#131c34;border-bottom:2px solid #b08d57;padding-bottom:3px;break-after:avoid}
.rec h3{font-size:13px;margin:12px 0 4px;color:#131c34;break-after:avoid}
.rec h4{font-size:12px;margin:10px 0 3px;color:#5b667d;text-transform:uppercase;letter-spacing:.06em;break-after:avoid}
.rhead{border-bottom:1px solid #d5dbe7;padding-bottom:10px}.rbrand{color:#b08d57;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:11px}
.rsub{font-size:14px;color:#1d2a45}.rnote{font-style:italic;color:#5b667d;font-size:10.5px;margin-top:4px}
table.rt{border-collapse:collapse;width:100%;margin:4px 0 8px;font-size:11px}
table.rt th,table.rt td{border:1px solid #cfd6e6;padding:4px 7px;text-align:left;vertical-align:top}
table.rt thead th{background:#131c34;color:#fff;font-weight:600}
table.rt.kv th{background:#f1f4fa;width:32%;font-weight:700}
table.rt tr{break-inside:avoid}
.rfig{margin:8px 0;break-inside:avoid}.rfig figcaption{font-weight:700;font-size:11px;color:#5b667d;margin-bottom:3px}
.rimg{width:100%;border:1px solid #cfd6e6;display:block}
.rec .pre{white-space:pre-line;background:#f6f7fb;padding:6px 10px;border-radius:4px}

.rdiv{background:#131c34;color:#fff;font-family:Cambria,Georgia,serif;font-size:18px;padding:10px 16px;margin:24px 0 6px;break-after:avoid;border-left:8px solid #b08d57}
.rsl{margin:0 0 6px}.rsl h2{margin-top:16px}.rskip h2{color:#9aa3b8}
.rstatic{margin:4px 0 6px}.rstatic .intro{font-style:italic;color:#5b667d;margin:2px 0 6px}
.rstatic .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.rstatic .cols>*:only-child{grid-column:span 2}
.rstatic .panel{background:#f3f5fa;border-radius:6px;padding:6px 12px}.rstatic .panel p{margin:4px 0}
.rstatic .ptitle{font-size:12px;margin:0 0 3px;color:#131c34}
.rstatic ul.bullets{margin:3px 0;padding:0;list-style:none}.rstatic .bullets li{position:relative;padding-left:12px;margin:2px 0}
.rstatic .bullets li:before{content:"";position:absolute;left:0;top:.55em;width:4px;height:4px;border-radius:50%;background:#131c34}
.rstatic .bullets li.sub{margin-left:12px;color:#5b667d}.rstatic .bullets li.sub:before{background:#5b667d}
.rstatic table.ro{border-collapse:collapse;width:100%;font-size:10.5px;margin:4px 0}
.rstatic table.ro th{background:#131c34;color:#fff;text-align:left;padding:3px 6px}.rstatic table.ro td{border:1px solid #cfd6e6;padding:3px 6px;vertical-align:top}
.rstatic table.ro td:first-child{font-weight:700;background:#f1f4fa}
.rstatic .contact{font-size:13px}
.rchk{list-style:none;padding:0;margin:3px 0}.rchk li{margin:2px 0}
.rlbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#b08d57;font-weight:700;margin:8px 0 3px}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  #app,.rec-bar{display:none!important}
  #rec-overlay{position:static;display:block;background:#fff;overflow:visible}
  body:not(.rec-open) #rec-overlay{display:none}
  .rec{box-shadow:none;margin:0;max-width:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<div id="app">
  <header class="top">
    <div class="brand">Let’s chat<small>Estate planning</small></div>
    <div class="sp"></div>
    <span class="status" id="status"></span>
    <button class="btn ghost sm" id="loadBtn">Load saved data</button>
    <button class="btn ghost sm" id="recBtn">Meeting record (PDF)</button>
    <button class="btn gold sm" id="saveBtn">Save data (.json)</button>
    <button class="btn ghost sm" id="newBtn">New meeting</button>
    <input type="file" id="loadFile" accept=".json,application/json" style="display:none">
  </header>
  <div class="main">
    <nav id="nav"></nav>
    <section id="stage">
      <div id="slide"></div>
      <div class="foot">
        <button class="btn" id="prev">← Previous</button>
        <button class="btn" id="sketchBtn">✏ Sketch pad</button>

        <span class="sp"></span>
        <span id="counter" style="color:var(--muted);font-size:.9rem"></span>
        <button class="btn gold" id="next">Next →</button>
      </div>
    </section>
  </div>
</div>
<div id="rec-overlay"></div>
<datalist id="dl-people"></datalist>

  cur = Math.max(0, Math.min(SLIDES.length - 1, i)); padOpen = false; S.meeting.cur = cur;
  document.getElementById("slide").scrollTop = 0; render(); scheduleSave();
}
function nextVisible(dir) {
  let i = cur + dir; while (i >= 0 && i < SLIDES.length && S.meeting.skip[SLIDES[i].id] && !SLIDES[i].cover) i += dir;
  go(i < 0 || i >= SLIDES.length ? cur : i);
}


// ====================== import a file saved from the generator (e.g. after a first call) ======================
function importGenerator() {
  const T = S.tables, M = S.meeting, I = S.info, E = M.extra, g = (t) => (T[t] || []).filter((r) => r && Object.values(r).some((x) => (Array.isArray(x) ? x.length : String(x == null ? "" : x).trim() && x !== false)));
  const cn = T.clients.map((c) => String(c.name || "").trim());
  const relMap = {}; RELATIONS.forEach((r) => (relMap[r.toLowerCase().replace(/[\s\/]+/g, "")] = r));
  const norm = (s) => String(s || "").toLowerCase().replace(/[\s\/\-]+/g, "");
  const parts = (r) => ({ address: r.address || "", street: r.street || "", suburb: r.suburb || "", state: r.state || "", post: r.post || "" });
  const count = { people: 0, assets: 0, placeholders: [] };
  M.people = []; M.assets = [];
  g("children").forEach((c) => { M.people.push(Object.assign(newPerson("Child"), { name: c.name, alias: c.alias || "", dob: c.dob || "", phone: c.phone || "", email: c.email || "" }, parts(c))); count.people++; });
  g("others").forEach((o) => {
    let txt = String(o.relationship || "").trim(), to = "";
    const mm = /^(.*?)\s*(?:\(([^)]+)\)|\bof\s+(.+))$/i.exec(txt);
    if (mm) { const who = (mm[2] || mm[3] || "").trim().toLowerCase(); const ix = cn.findIndex((n) => n && (n.toLowerCase() === who || n.toLowerCase().startsWith(who) || n.toLowerCase().split(" ").includes(who))); if (ix >= 0) { to = String(ix); txt = mm[1].trim(); } }
    const rel = relMap[norm(txt)] || relMap[norm(txt.replace(/\/.*$/, ""))] || (norm(txt) === "spousepartner" ? "Spouse / partner" : "");
    const p = Object.assign(newPerson(rel || (txt ? "Other" : "")), { name: o.name, alias: o.alias || "", to, phone: o.phone || "", email: o.email || "" }, parts(o));
    if (!rel && txt) p.relText = String(o.relationship).trim();
    M.people.push(p); count.people++;
  });
  const A = (a) => { M.assets.push(a); count.assets++; };
  g("assetsi").forEach((a) => A(Object.assign(newAsset("personal"), { desc: a.name, owner: a.owner, realprop: /property|home|house|unit|land|lot\b|apartment/i.test(a.name || "") })));
  g("assetsj").forEach((a) => A(Object.assign(newAsset("joint"), { desc: a.name, owner: a.owner, howheld: a.type === "Unsure" ? "" : a.type || "" })));
  g("assetss").forEach((a) => A(Object.assign(newAsset("super"), { desc: a.name, owner: a.member, fundtype: a.type === "SMSF" ? "SMSF" : "Retail / industry fund", insurance: !!a.insurance })));
  g("assetst").forEach((a) => A(Object.assign(newAsset("trust"), { desc: a.name, trusttype: a.type, trustee: a.trustee, assets: a.details })));
  g("assetsc").forEach((a) => A(Object.assign(newAsset("company"), { desc: a.name, assets: a.details })));
  // yes/no answers from the call that have no matching list entry: add a clearly-marked placeholder
  const ph = (a, note) => { A(Object.assign(newAsset(a.kind), a, { desc: a.desc + " (to be confirmed)" })); count.placeholders.push(note); };
  const has = (k) => M.assets.some((a) => a.kind === k);
  if (I.client_business === "Yes") ph({ kind: "business", desc: "Business", btype: I.client_businessmulti === "Yes" ? BTYPES[1] : BTYPES[0] }, "a business");
  if (I.client_partnership === "Yes") ph({ kind: "business", desc: "Partnership / joint venture", btype: BTYPES[2] }, "a partnership / joint venture");
  if (I.client_overseasassets === "Yes") ph({ kind: "personal", desc: "Overseas asset", loc: "Overseas" }, "an overseas asset");
  if (I.client_interstate === "Yes") ph({ kind: "personal", desc: "Interstate property", loc: "Interstate", realprop: true }, "an interstate property");
  if (I.client_joint === "Yes" && !has("joint")) ph({ kind: "joint", desc: "Jointly held asset" }, "a jointly held asset");
  if (I.client_retail === "Yes" && !M.assets.some((a) => a.kind === "super" && a.fundtype !== "SMSF")) ph({ kind: "super", desc: "Super fund", fundtype: "Retail / industry fund" }, "a retail/industry super fund");
  if (I.client_smsf === "Yes" && !M.assets.some((a) => a.kind === "super" && a.fundtype === "SMSF")) ph({ kind: "super", desc: "SMSF", fundtype: "SMSF" }, "an SMSF");
  if (I.client_trust === "Yes" && !has("trust")) ph({ kind: "trust", desc: "Trust" }, "a trust");
  if (I.client_company === "Yes" && !has("company")) ph({ kind: "company", desc: "Company" }, "a company");
  const want = parseInt(I.client_property_no, 10) || 0, have = M.assets.filter((a) => a.realprop && a.loc === "Queensland").length;
  for (let i = have; i < want; i++) ph({ kind: "personal", desc: "Queensland property", loc: "Queensland", realprop: true }, "a Queensland property");
  if (I.client_exspouse === "Yes" && !M.people.some((p) => p.rel === "Ex-spouse / de facto")) { M.people.push(Object.assign(newPerson("Ex-spouse / de facto"), { name: "" })); count.placeholders.push("an ex-spouse / de facto (name needed)"); }
  const flags = [["client_step", "step-children"], ["client_dependents", "dependants / special needs"], ["client_challenge", "someone who may challenge the Will"], ["client_overseasrecipients", "a beneficiary living overseas"]].filter(([k]) => I[k] === "Yes").map(([, t]) => t);
  M.extra.imported = { flags, from: "generator", at: new Date().toISOString() };
  M.extra.impflags = {}; ["client_step", "client_dependents", "client_challenge", "client_overseasrecipients"].forEach((k) => { if (I[k] === "Yes") M.extra.impflags[k] = true; });
  if (I.client_mutual === "Yes") M.extra.mutual = "Yes";
  // Will and EPA answers, if the generator file has them: go to the client named as Willmaker
  let wnote = "";
  const wt = String(S.will.testator || "").trim().toLowerCase(), wi0 = Math.max(0, cn.findIndex((n) => n.toLowerCase() === wt));
  const rows = (t) => g(t).map((r) => String(r.name || "").trim()).filter(Boolean);
  const bk = (t) => g(t).map((r) => ({ names: Array.isArray(r.name_list) && r.name_list.length ? r.name_list.slice() : [r.name || ""], replace: (r.replace_sel || []).slice() }));
  const any = ["executorsi", "executorsb", "guardian", "guardiansb", "ppi", "ppb", "balancei", "balanceb", "balancec", "sgs", "tts", "attorney", "attorneyf"].some((t) => g(t).length);
  if (any) {
    const w = newWill(); wills();
    Object.assign(w, { exec: rows("executorsi"), execb: bk("executorsb"), guard: rows("guardian"), guardb: bk("guardiansb"), ppi: rows("ppi"), ppb: rows("ppb"),
      balancei: g("balancei").map((r) => Object.assign({ backup: false, backupperson: "" }, r)), balanceb: g("balanceb").map((r) => Object.assign({ backup: false, backupperson: "" }, r)), balancec: g("balancec").map((r) => Object.assign({ backup: false, backupperson: "" }, r)),
      calamity: !!S.will.calamity, gifts: g("sgs").map((r) => Object.assign({}, r)),
      tts: g("tts").map((t) => ({ name: t.name, primary: t.primary, trustee: t.trustee, appointor: t.appointor, special: t.special, ld: t.ldsingle ? "ldsingle" : t.ldmultiple ? "ldmultiple" : t.ldunknown ? "ldunknown" : "" })),
      marriage: S.will.marriage ? S.will.marriage_party || "" : "", divorce: S.will.divorce ? S.will.divorce_party || "" : "",
      short: !!S.docs.epa, long: !!S.docs.epalong, att: (T.attorney || []).filter((r) => !r.decauto && String(r.name || "").trim()).map((r) => r.name), attf: (T.attorneyf || []).filter((r) => !r.decauto && String(r.name || "").trim()).map((r) => r.name),
      prof_on: !!S.p.prof_on, spouse_on: S.p.spouse_on !== false, dec: JSON.parse(JSON.stringify(S.dec || {})) });
    M.wills[wi0] = w; M.extra.willfor = String(wi0);
    if (Object.keys(S.will).some((k) => /^powers_/.test(k) && S.will[k])) { M.extra.powers_manual = true; M.extra.powerSet = {}; Object.keys(S.will).forEach((k) => { if (/^powers_/.test(k)) M.extra.powerSet[k] = !!S.will[k]; }); }
    if (S.will.tt || w.tts.length) M.extra.willtype = "Testamentary trust Will";
    wnote = "\nWill and EPA answers found in the file were loaded for " + (cn[wi0] || "the first client") + " (Section 3 slides).";
  }
  if (!M.extra.willtype && S.will.tt) M.extra.willtype = "Testamentary trust Will";
  S.doc_date = S.doc_date || todayISO();
  const ini = S.email.initial_date; if (!ini || ini < todayISO()) S.email.initial_date = todayISO();
  return "This file was saved from the document generator, so it has been used to pre-fill the meeting page:\n• " + T.clients.filter((c) => c.name).length + " client(s), " + count.people + " family / key people, " + count.assets + " asset / structure item(s)." +
    (count.placeholders.length ? "\n• Marked ‘(to be confirmed)’ because the earlier answers said Yes: " + count.placeholders.join(", ") + "." : "") +
    (flags.length ? "\n• The earlier file also noted: " + flags.join(", ") + " (shown on the Family slide)." : "") + wnote + "\n\nCheck each slide with the client and add what is missing.";
}

// ====================== save / load ======================
function fileName() { const n = nameJoin(S.tables.clients.map((c) => (c.name || "").trim()).filter(Boolean)) || "Client"; return "Saved data - " + n.replace(/[\\/:*?"<>|]+/g, "") + ".json"; }
function saveFile() {
  derive();
  const blob = new Blob([JSON.stringify({ app: "estate-planning-generator", version: 1, saved: new Date().toISOString(), state: S }, null, 1)], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: fileName() }); document.body.appendChild(a); a.click(); a.remove();
  setStatus("Saved file downloaded");
}
function normalise(st) {
  const e = emptyState();
  Object.keys(e).forEach((k) => { if (st[k] == null) st[k] = e[k]; });
  ["info", "email", "will", "p", "docs", "dec"].forEach((k) => { st[k] = Object.assign({}, e[k], st[k]); });
  st.tables = Object.assign({}, e.tables, st.tables);
  st.meeting = Object.assign({}, e.meeting, st.meeting);
  ["hk", "skip", "notes", "strokes", "extra"].forEach((k) => { st.meeting[k] = st.meeting[k] || {}; });
  ["idcheck", "people", "assets"].forEach((k) => { st.meeting[k] = st.meeting[k] || []; });
  if (!st.tables.clients.length) st.tables.clients.push({});
  return st;
}
function loadObject(obj) {
  const st = obj && obj.state ? obj.state : obj;
  if (!st || !st.tables) throw new Error("Not a saved estate planning file");
  const hadMeeting = !!st.meeting;
  S = normalise(st);
  if (!hadMeeting) alert(importGenerator());
  cur = Math.min(S.meeting.cur || 0, SLIDES.length - 1); render(); saveLocal();
}
function restore() {
  try { const t = localStorage.getItem(LS_KEY); if (t) { S = normalise(JSON.parse(t)); cur = Math.min(S.meeting.cur || 0, SLIDES.length - 1); setStatus("Restored the previous session in this browser"); } } catch (e) { }
}

// ====================== start ======================
function init() {
  restore();
  const $ = (id) => document.getElementById(id);
  $("prev").addEventListener("click", () => go(cur - 1));
  $("next").addEventListener("click", () => nextVisible(1));
  $("skipCb").addEventListener("change", (e) => { S.meeting.skip[SLIDES[cur].id] = e.target.checked; scheduleSave(); render(); });
  $("sketchBtn").addEventListener("click", () => { padOpen = !padOpen; render(); if (padOpen) { const b = $("slide"); b.scrollTop = b.scrollHeight; } });
  $("saveBtn").addEventListener("click", saveFile);
  $("recBtn").addEventListener("click", showRecord);
  $("loadBtn").addEventListener("click", () => $("loadFile").click());
  $("loadFile").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { try { loadObject(JSON.parse(r.result)); } catch (err) { alert("Could not load that file: " + err.message); } };
    r.readAsText(f); e.target.value = "";
  });
  $("newBtn").addEventListener("click", () => {
    if (!confirm("Start a new meeting? Anything not saved to a file will be cleared from this browser.")) return;
    S = emptyState(); try { localStorage.removeItem(LS_KEY); } catch (e) { } cur = 0; render(); setStatus("New meeting");
  });
  document.addEventListener("keydown", (e) => {
    const t = (e.target.tagName || "").toLowerCase(); if (t === "input" || t === "textarea" || t === "select") return;
    if (e.key === "ArrowRight") nextVisible(1); else if (e.key === "ArrowLeft") nextVisible(-1);
  });
  window.addEventListener("beforeunload", saveLocal);
  render();
}
init();
